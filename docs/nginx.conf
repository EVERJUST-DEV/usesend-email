server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The container listens on 8080 behind the ALB's HTTPS listener. Nginx's default
  # absolute redirects turned /docs into http://mail.everjust.app:8080/docs/, a dead
  # URL. Relative redirects keep the scheme, host and port the browser used.
  absolute_redirect off;

  # Static export uses trailing slashes → directories with index.html.
  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  # Nginx's own liveness (ALB health check uses /docs/).
  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }
}
