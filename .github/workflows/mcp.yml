name: MCP

# Type-check + build the useSend MCP server whenever it changes.
on:
  push:
    branches: [main]
    paths:
      - 'mcp/**'
      - '.github/workflows/mcp.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install
      - name: Type-check + build
        run: npm run build
