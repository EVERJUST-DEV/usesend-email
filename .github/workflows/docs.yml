name: Docs

# Validates the Fumadocs static export builds under the /docs base path.
# (Container build + ECS deploy to mail.everjust.app/docs are added next.)
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install --legacy-peer-deps
      - name: Build (Next static export, basePath /docs)
        run: npm run build
      - name: Verify /docs base path nesting
        run: test -f out/docs/index.html && echo "out/docs/index.html present ✓" || (echo "MISSING out/docs/index.html"; exit 1)
