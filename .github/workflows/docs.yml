name: Docs

# Build the Fumadocs static export into an nginx image, push to ECR, and deploy
# the docs ECS service behind the ALB (mail.everjust.app/docs). Runs on every
# docs change. All AWS work happens here (keyless via GitHub OIDC). The docs
# Terraform is a standalone module (terraform/docs) with its own state, so it
# needs none of the app's variables or secrets and never touches the app.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'terraform/docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: docs-deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ROLE_ARN: arn:aws:iam::678806349176:role/usesend-ci-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        working-directory: terraform/docs
        run: terraform init -input=false

      - name: Ensure ECR repository
        working-directory: terraform/docs
        run: terraform apply -input=false -auto-approve -target=aws_ecr_repository.docs

      - name: Build + push docs image
        working-directory: docs
        run: |
          set -euo pipefail
          ECR=$(cd ../terraform/docs && terraform output -raw docs_ecr_url)
          echo "ECR=$ECR"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "${ECR%%/*}"
          docker build -t "$ECR:$GITHUB_SHA" -t "$ECR:latest" .
          docker push "$ECR:$GITHUB_SHA"
          docker push "$ECR:latest"

      - name: Terraform apply (docs infra)
        working-directory: terraform/docs
        run: terraform apply -input=false -auto-approve -var="docs_image_tag=$GITHUB_SHA"

      - name: Wait for docs service to stabilize
        run: |
          aws ecs wait services-stable --cluster usesend-cluster --services usesend-docs --region "$AWS_REGION" || true
          aws ecs describe-services --cluster usesend-cluster --services usesend-docs --region "$AWS_REGION" \
            --query 'services[0].{running:runningCount,desired:desiredCount,rollout:deployments[0].rolloutState}' --output json
