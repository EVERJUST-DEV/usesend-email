name: Docs

# Rebuild + redeploy the docs whenever anything in docs/ changes (or on demand).
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Build always runs — it validates the Fumadocs static export even if Pages
  # isn't enabled yet (private-repo Pages needs a paid plan).
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install --legacy-peer-deps
      - name: Build (Next static export)
        run: npm run build
        env:
          # Project Pages is served under /usesend-email. For a custom domain,
          # set this to an empty string (and NEXT_PUBLIC_SITE_URL to the domain).
          NEXT_PUBLIC_BASE_PATH: /usesend-email
          NEXT_PUBLIC_SITE_URL: https://everjust-dev.github.io/usesend-email
      - name: Disable Jekyll (serve _next/ as-is)
        run: touch out/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/out

  # Deploy runs only if GitHub Pages is enabled for the repo (Settings → Pages →
  # Source: GitHub Actions). If it isn't, this job fails harmlessly and the build
  # above still confirms the docs compile.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
